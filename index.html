<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador Interativo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 20px;
        }
        #contador {
            font-size: 36px;
            color: #007BFF;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Contador de Cliques</h1>
    <p>Clique no botão para aumentar o contador:</p>
    <button onclick="aumentarContador()">Clique aqui!</button>
    <div id="contador">0</div>

    <script>
        let cont = 0;

        function aumentarContador() {
            cont++;
            document.getElementById('contador').innerText = cont;
        }
    </script>
</body>
</html>
